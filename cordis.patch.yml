# dsh-qwen-paint —— bundle 自己的补丁层
#
# 这个文件只负责把插件本体的 host 行插进来；它**不碰** profile 的
# package.json，也不碰模型路由。安装走官方 plugin_manager 的 install_bundle。
#
# 可调项（都在这里改，升级插件不会覆盖这一层）：
#   comfyUrl      ComfyUI 服务地址（默认本机 8188）
#   outputDir     出图落盘目录（默认桌面「千问1生图」，遵循工作区约定）
#   workflowFile  自定义 workflow JSON 的路径；留空则用内置的千问文生图模板
- insert:
    - id: qwen-paint
      name: 'dsh-qwen-paint'
      config:
        comfyUrl: 'http://127.0.0.1:8188'
        # ★★★ 2026-10-09（通用化改造）：**安装路径一律不写死**，插件会自动探测。
        #
        #   探测顺序（先权威后兜底）：
        #     ① 下面三项**填了就用**（尊重用户显式配置）；
        #     ② 从正在运行的 ComfyUI 进程反查（最准，它自己带着完整命令行）；
        #     ③ 扫常见安装位置 —— 官方 Windows 便携包、常见盘符，
        #        以及**各盘根目录下名字含 comfy 的目录**（能覆盖 ComfyUI-rocm 这类改名安装）。
        #
        #   ⇒ 因此**绝大多数用户什么都不用填**。只有装在极冷门路径、且自动探测失败时，
        #     才需要放开下面三行改成自己的路径：
        #
        # comfyPython: 'D:\ComfyUI_windows_portable\python_embeded\python.exe'
        # comfyMainPy: 'D:\ComfyUI_windows_portable\ComfyUI\main.py'
        # comfyWorkdir: 'D:\ComfyUI_windows_portable'
        #
        # comfyOutputDir 留空（默认）= 取图直接走 ComfyUI 的 /view 接口，
        #   不去猜本地 output 目录在哪（猜错会读到同名的旧文件，是个真实踩过的坑）。
        #
        # ★★ 注意力后端**完全不用配** —— 插件会识别显卡厂商/架构自动选：
        #     AMD RDNA3（RX 7000 系）→ --use-quad-cross-attention（实测 +15%）
        #     AMD RDNA4（RX 9000 系）→ --use-pytorch-cross-attention（走 CK SDPA 内核）
        #     AMD RDNA2（RX 6000 系）→ --use-pytorch-cross-attention（该代无融合内核，保守）
        #     NVIDIA / Intel Arc     → --use-pytorch-cross-attention
        #     识别不出厂商           → 不加任何参数（保证能起来）
        #   ⚠ comfyArgs 一旦填写会**完全接管**启动参数、绕过上面这套自动逻辑，非必要别动。
        # comfyArgs:
        #   - '--use-quad-cross-attention'

        # ★ 能力探测结果的缓存时长（毫秒，默认 10 分钟）。
        #   装了新节点 / 新模型想让探测立刻刷新：重启插件，或把这里调小。
        # capabilityCacheMs: 600000

        # ★★ 是否**自动配置厂商专用加速环境**（默认 true）。
        #   true  → 插件加载后自动检测缺哪个厂商专用加速包，缺就自动下载安装
        #           （白名单内、且仅当前平台适用；多源自动切换；失败只写日志，不影响出图）。
        #   false → 只报告不下载，需要时手动调 check_acceleration(action:'install')。
        #   ⚠ 会真的改动用户环境（git clone / pip install 第三方代码），介意就设为 false ——
        #     出图功能不受影响，只是少了厂商专用加速（缺件本来就会自动降级到可用链路）。
        accelAutoInstall: true

        # ★★★ 插件总开关（默认 true，装上即用）。
        #   false → 插件对 DSH 相当于"不存在"：不注册 draw_image、不注入任何提示词、
        #           不预热 ComfyUI、也不做空闲关停。
        #           但 check_acceleration / list_available_models 两个**诊断类**工具仍保留
        #           （只读、不画图）—— 否则真出了问题连查都没法查。
        #   用途：临时收起画图能力 / 同一 DSH 里跑多个图像后端避免抢话 / 排查问题时摘出去。
        # enabled: true

        # ★★★ 生图意图判定策略（默认 auto）—— 决定"模型多主动地判断用户想不想画图"。
        #
        #   'off'    不做主动引导，只在用户**直接点名**要画图时才画。适合想要个安静工具的人。
        #   'strict' 只在用户**明确要求**且**画面描述具体**时才画；模糊的**先问一句**。
        #            适合怕误触发的人。
        #   'auto'   判断是生图请求就画；但**排除**"画个流程图/思维导图/表格"这类
        #            通常该用文字或其它工具的场景，那种**先确认一句**再决定。平衡档（默认）。
        #   'eager'  只要沾边就画（最积极）。适合确定只用它画图的人。
        #
        #   ⚠ 无论哪一档，都不会在用户**没有**生图意图时去调工具 ——
        #     最松的 eager 也只是"沾边就画"，不是"无脑画"。
        # drawTrigger: 'auto'

        # ★ outputDir 故意**不写死**：插件默认会按当前用户的桌面推算（USERPROFILE/Desktop/千问1生图）。
        #   写死绝对路径有两个害处：① 别人装上后往**不存在的目录**写，出图会失败；
        #   ② 包里带着打包者的 Windows 用户名。
        #   要固定在别处，放开下面这行并改成你的路径：
        # outputDir: 'D:\我的图'
        # ★★ 2026-10-09：600000(10分钟) → 300000(5分钟)。见 DEFAULTS 注释：
        #   10 分钟太大，后端一旦卡住会"假性卡死"干等；5 分钟覆盖首次加载+大图余量足够。
        timeoutMs: 300000

        # ★★★ 2026-10-09（主人要求「设成我的默认配置」）：**优化档显式钉在这里**。
        #
        #   为什么写在这一层：插件代码里的 DEFAULTS 是**隐式**的 —— 界面上看不见、
        #   不方便改，而且升级插件会被覆盖。写进 bundle patch 层则「看得见、可改、升级不丢」，
        #   等于把「我的优化档」直接设在 DSH 上，任何调用生图的请求都走这一套。
        #
        #   这一组就是实测约 7–10 秒出图的配置。
        #   对照：不挂 Turbo8 的裸跑要 25 步时，单张要 1–2 分钟。
        resolution: 1024            # 默认边长（调用方没指定比例时用它）
        steps: 8                    # Turbo8 蒸馏档（不挂 LoRA 的裸跑要 20–30 步才出质量）
        forceTurbo8Steps: true      # 锁死 8 步 —— 调用方传 steps:25 也会被忽略
        #
        # ★★★ 2026-10-09 **尺寸锁已撤销**（主人决定：完全听调用方）。
        #
        #   为什么撤：`forceOptimizedSize: true` 会把**任何**请求尺寸都改写成 1024²，
        #   于是界面上 7 个比例**全部失效**，选 3:4 / 16:9 出来的都是方图。
        #   实测对照表（撤销前）：
        #     1:1 992² → 1024² ｜ 3:4 864x1152 → 1024² ｜ 4:3 1152x864 → 1024²
        #     2:3 832x1216 → 1024² ｜ 3:2 1216x832 → 1024² ｜ 16:9 1344x736 → 1024²
        #   这是**功能被静默阉割**，省下的那点时间是拿画幅换的，不划算。
        #
        #   撤掉之后：调用方要什么尺寸就给什么尺寸（仍受 32 对齐约束）。
        #   想再锁回来：把它设成 true（或直接删掉本行，见 DEFAULTS 的默认值）。
        forceOptimizedSize: false
        #
        #   ⚠ 只影响**尺寸**。`forceTurbo8Steps: true` 仍保留 —— 那是 Turbo8 蒸馏
        #     LoRA 的工作点，和尺寸无关，步数放开只会变慢/变糊。
        #     图生图本来就不受尺寸约束（按参考图尺寸走）。

        # ★★★ 2026-10-08 新增：**hipfire 出图后端**（与 ComfyUI 并存，可切换）。
        #
        #   imageBackend: 'comfyui'（默认，行为不变）| 'hipfire'
        #
        #   ⚠ 用 hipfire 前必须知道的两件事（都是上游的客观限制）：
        #     ① hipfire 只支持 **FLUX.1（arch 40）/ FLUX.2 Klein（arch 45）**。
        #        ComfyUI 那套 Qwen-Image 2.1 **喂不进 hipfire** ——
        #        容器格式（要 .hfq 包）与架构（arch_id/loader/kernel）都不支持。
        #     ② hipfire 出图模型 registry 里只有 flux.schnell:1 / flux.dev:1（各 23.8 GB，
        #        含 T5/CLIP/VAE sidecar 共约 31.5 GB）。24 GB 卡（如 RX 7900 XT）
        #        按上游文档装不下 FLUX.1；能跑的是 FLUX.2 Klein 4B（~13 GB，需自行打包）。
        #
        #   hipfireImgModel: 出图模型。可写 registry tag / 别名 / 文件名，
        #     也可以写 **本地 hfq trunk pack 的路径** —— 官方规定指向
        #     `<base>-transformer.hfq`，同目录下放好同名的 `-qwen3.hfq` /
        #     `-vae.hfq` sidecar 包即可，**不需要注册进 registry**。
        #
        #   ⚠ 2026-10-08：Klein 4B 的 pipe 与打包产物**已按用户要求删除**
        #     （释放约 24 GB）。所以下面这行**先注释掉**，不再指向不存在的文件。
        #
        #     要用 hipfire 出图时，按以下步骤重新准备，然后取消注释并改成
        #     实际路径（或改用 registry 里现成的 tag）：
        #       ① 下载 pipe（约 16 GB，注意排除重复的单文件副本）：
        #          hf download black-forest-labs/FLUX.2-klein-4B ^
        #            --local-dir X:\hipfire/models/flux-klein-pipe ^
        #            --exclude "flux-2-klein-4b.safetensors" "*.jpg" "*.png" "*.webp"
        #       ② 打包成 3 个 hfq 组件（约 20+ 分钟，单核慢）：
        #          hipfire-quantize --flux-pipe X:\hipfire/models/flux-klein-pipe ^
        #            --output X:\hipfire/models/flux-klein.hfq
        #          → flux-klein-transformer.hfq (45) / -qwen3.hfq (46) / -vae.hfq (43)
        #       ③ 把下面这行改成 'X:\hipfire/models/flux-klein-transformer.hfq'
        #
        #     也可以直接用 registry 里现成的（但 FLUX.1 schnell 需 ~24.3 GB 显存，
        #     RX 7900 XT 的 20 GB 装不下；仅 gfx1151 统一内存等机型可用）：
        #       hipfireImgModel: 'flux.schnell:1'
        # hipfireImgModel: 'X:\hipfire/models/flux-klein-transformer.hfq'
        #
        #   hipfireExe: hipfire 可执行文件。**留空 = 自动探测**（依次查
        #     HIPFIRE_EXE → HIPFIRE_HOME/{,engine/,bin/} → PATH → C–K 各盘常见位置）。
        #     要指定就写绝对路径，例如 'X:\hipfire\engine\hipfire.exe'。
        imageBackend: 'comfyui'
        hipfireExe: ''
        #   hipfireTransport: 'auto'（默认：先探 HTTP，不通回退 CLI）| 'http' | 'cli'
        hipfireTransport: 'auto'
        #   hipfireUrl: `hipfire serve` 的监听地址。要常驻出图（免去每次加载权重）
        #     就先起：hipfire serve 127.0.0.1 11580 -d
        hipfireUrl: 'http://127.0.0.1:11580'
        hipfireTimeoutMs: 600000
        hipfireBackend: 'gpu'
        #   hipfirePrecheckModel（默认 true）：出图前先查模型在不在本地。
        #     ⚠ 强烈建议保持 true —— 实测 `hipfire img <缺失模型>` **不会报错**，
        #       而是**静默开始下载几十 GB**，在 600 秒超时里表现为"毫无反应"。
        hipfirePrecheckModel: true

        # ★★★ 2026-10-09 **最终决定：关掉 BlockCache，回到 TE-Speed + Speedup**。
        #
        #   背景：BlockCache T8 当初是为了替代失败的 ToMe 而引入的（ToMe 在千问 2.1 上
        #   三条插入点全走不通，已整体移除）。它**确实能跑**，但实测下来不是最优：
        #
        #     ┌────────────────────────────┬──────────┬─────────┐
        #     │ 方案                        │ 采样耗时  │ 相对基线 │
        #     ├────────────────────────────┼──────────┼─────────┤
        #     │ 基线（只 turbo8 八步）       │ 11.581 s │   —     │
        #     │ + TE-Speed                  │  9.431 s │ −18.6%  │
        #     │ + Speedup                   │ 10.711 s │  −7.5%  │
        #     │ + TE-Speed + Speedup  ★最优 │  8.639 s │ −25.4%  │
        #     │ + BlockCache T8             │  9.712 s │ −16.1%  │
        #     └────────────────────────────┴──────────┴─────────┘
        #     （数据来源：`叠加加速方案实测报告.md`，口径为**纯采样时间**，
        #       基准 = turbo8 八步，同一台 RX 7900 XT / ROCm 7.2.1。）
        #
        #   ⇒ BlockCache 单独用（9.712 s）**比 TE+Speedup（8.639 s）慢 11%**，
        #     却还要求独占 DIFFUSION_MODEL wrapper、把后两者全挤掉。
        #     那就是**净亏**：更慢，还少了两个能用的一起上。
        #     所以选 TE-Speed + Speedup 这一组。
        #
        #   ⚠ 三者的结构互斥关系（实测，不是猜测）：
        #     BlockCache / TE-Speed / Speedup **都**在 ModelPatcher 上注册
        #     DIFFUSION_MODEL + OUTER_SAMPLE 两种 wrapper；其中 BlockCache 要求
        #     **独占** DIFFUSION_MODEL。同挂任意组合会让 KSampler 抛
        #     `ValueError: Qwen Image 2.1 T8 cache requires exclusive diffusion-wrapper
        #      ownership`，把**整单打回**（报告 2026-10-08 一行已记录 `06 + TE + T8 → 报错`）。
        #
        #   ✅ 于是插件里做的是：**BlockCache 一旦开启，TE-Speed 与 Speedup 自动让位**
        #      （见 `resolvePlan` 里的 useTeFinal / useSpeedupFinal）。
        #      反过来，把 blockCacheEnabled 设成 false，两者立刻回到链子里 ——
        #      开关就这一个，不用改别的键。
        #
        # ★★★★ 2026-10-09 二次修正：**改回 true，但改成"按尺寸自动选"**。
        #
        #   上一轮写 false 的依据是「TE+Speedup 8.639 s < BlockCache 9.712 s」——
        #   那个对比是在**小尺寸 + 模型已驻留**的理想条件下测的。
        #
        #   但在 1408×1408 的真实场景里，ComfyUI 日志实测：
        #       Qwen TE predictor: predicted 0/8 steps (**0.0%** model-call acceleration)
        #       QwenImage21Speedup: 1 cached of 8 model forwards (**12.5%** skipped)
        #   ⇒ **TE 一步没命中、Speedup 只跳 1 步，却占着互斥的 wrapper 坑。**
        #   而 BlockCache T8 是在**大尺寸**（基线 120.75 s）下实测 **+22.7%**（省 27.4 s）。
        #
        #   ⇒ 结论：**该用哪一套是由尺寸决定的**，一刀切必然有一档是错的。
        #     所以这里改回 true（= 允许 BlockCache 这个节点上链），
        #     再由 `wrapperPolicy: auto` 按本次出图尺寸决定三者谁上：
        #       · latent tokens ≤ 16384（≈1024²）→ TE-Speed + Speedup（+25.4%）
        #       · latent tokens >  16384（1408²=30976）→ BlockCache T8（+22.7%）
        #
        #   ★ 用户可见开关：面板「优化」里 BlockCache T8 仍可手动开/关；
        #     关掉它 = 大尺寸也退回 TE-Speed + Speedup。
        blockCacheEnabled: true
        # 三选一的策略：auto（按尺寸）/ te（始终 TE+Speedup）/ bc（始终 BlockCache）
        wrapperPolicy: auto
        # auto 的分界（latent token 数 = round(W/8) × round(H/8)）；16384 = 1024²
        wrapperAutoTokensThreshold: 16384
        blockCacheThreshold: 0.03       # 官方：图生图从 0.03 起步
        blockCacheStartPercent: 0.1     # 前 10% 进度不缓存（构图未稳）
        blockCacheEndPercent: 0.9       # 后 10% 进度不缓存（收尾要准）
        blockCacheMaxHits: 2            # 最多连续命中 2 步
        blockCacheDevice: 'cpu'         # 缓存放内存，别跟显存抢
        blockCacheMetricStride: 8
        blockCacheMaxMb: 1024
        blockCacheThresholdMode: 'two_stage'   # 前段 0.03 / 后段 0.15，稳一点
        blockCacheSplitRatio: 0.35
        blockCacheLateThreshold: 0.15
