# 发布到 ComfyUI Registry
#
# 依据官方文档：https://docs.comfy.org/registry/publishing#option-2-github-actions
#
# 触发条件：推送到 main 且改动涉及 pyproject.toml（即"版本/元数据变了才发"），
#   外加一个手动入口（workflow_dispatch）方便补发。
#
# ⚠ 前置条件（只有仓库所有者能做，见 README「上架 ComfyUI Registry」一节）：
#   在 Settings → Secrets and variables → Actions → Repository secrets
#   新建名为 REGISTRY_ACCESS_TOKEN 的 Secret，值是 ComfyUI Registry 的 API Key。
#
# ⚠ 本插件是 DSH 插件、**不是 ComfyUI 节点**；这里发布的只是**元数据**，
#   装进 ComfyUI 的 custom_nodes 不会生效（见 pyproject.toml 顶部说明）。

name: Publish to Comfy registry

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "pyproject.toml"

jobs:
  publish-node:
    name: Publish Custom Node to registry
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7
      - name: Publish Custom Node
        uses: Comfy-Org/publish-node-action@main
        with:
          personal_access_token: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
