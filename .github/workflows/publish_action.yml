# 发布到 ComfyUI Registry（**本分支 = 独立节点包**）
#
# ⚠ 这个 workflow 属于 `comfyui-node` 分支的节点包，**不属于** main 上的 DSH 插件。
#   之前误挂在 main 上，会把 DSH 插件当 ComfyUI 节点去发版 —— 已移除。
#
# 前置：Settings → Secrets and variables → Actions → Repository secrets
#       新建 REGISTRY_ACCESS_TOKEN（ComfyUI Registry 的 API Key）。
#       未配置时本 workflow 会失败，属预期。

name: Publish to Comfy registry

on:
  workflow_dispatch:
  push:
    branches:
      - comfyui-node
    paths:
      - "pyproject.toml"

jobs:
  publish-node:
    name: Publish Custom Node to registry
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7
      - name: Publish Custom Node
        uses: Comfy-Org/publish-node-action@main
        with:
          personal_access_token: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
