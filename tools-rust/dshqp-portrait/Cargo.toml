[package]
name = "dshqp-portrait"
version = "0.1.0"
edition = "2021"
description = "Pure-CPU local image compositing helper for dsh-qwen-paint (no model, no GPU, no network)"

[dependencies]
serde_json = "=1.0.154"
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg", "webp"] }

[profile.release]
opt-level = "z"
lto = true
strip = true
panic = "abort"
codegen-units = 1
