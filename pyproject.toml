# dsh-qwen-paint —— ComfyUI Registry 元数据
#
# ★★ 2026-10-14（用户要求）：按 **ComfyUI Registry 官方规范**重写。
#   依据：https://docs.comfy.org/registry/specifications
#         https://docs.comfy.org/registry/publishing
#
# ⚠⚠ 必须先读这一段（否则会误解本条目）
#   本插件是 **DSH（DeepSeek Harness）插件**，**不是** ComfyUI custom_node：
#     · 它**不跑在** ComfyUI 的 Python 进程里，而是通过 HTTP 与本机 ComfyUI 对话；
#     · 本仓库**没有任何 Python 节点文件**（没有 `__init__.py` / `NODE_CLASS_MAPPINGS`）；
#     · **把它装进 ComfyUI 的 custom_nodes 不会有任何效果** —— 它需要 DSH 宿主。
#   ⇒ 在 Registry 上架**只为元数据可被发现**；实际安装请走 DSH 的 `install_bundle`
#     （见 `cordis.patch.yml` 与 `一键安装.cmd`）。
#   ⇒ 因此 description 里**明确写了**这一点，不让 ComfyUI 用户误装。
#
# ════════════════════════════════════════════════════════════════════════════
# [project] —— PEP 621 标准元数据
# ════════════════════════════════════════════════════════════════════════════

[project]
# 唯一标识符，创建后不可更改。不含 "ComfyUI" 字样（规范要求）。
name = "dsh-qwen-paint"
# 语义化版本 X.Y.Z；每次发布必须递增，且旧版本号不可复用。
# ⚠ 与 package.json 的 version 保持**同一个数**，避免两处版本号打架。
version = "0.17.3"
description = "⚠ DSH（DeepSeek Harness）插件，不是 ComfyUI 节点：通过 HTTP 调用你本机的 ComfyUI，用 Qwen-Image 2.1 出图（turbo8 加速链 / VAE 分块解码 / OOM 自动回退 / 专业卡档位）。装进 ComfyUI 的 custom_nodes 不会生效 —— 它需要 DSH 宿主。"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
  { name = "yanfei0725", url = "https://github.com/yanfei0725/dsh-qwen-paint" },
  { name = "wonderandyou", url = "https://github.com/wonderandyou/dsh-qwen-paint" },
]
keywords = [
  "dsh", "deepseek-harness", "comfyui", "qwen-image", "qwen-image-2.1",
  "image-generation", "turbo8", "vae-tiling", "rocm", "cuda",
]
# ★ 只保留**真实成立**的分类器：本包是 JS（不声明 Python）、跨平台、三厂商 GPU 都可驱动。
classifiers = [
  "Programming Language :: JavaScript",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Topic :: Multimedia :: Graphics",
  "Environment :: GPU :: NVIDIA CUDA",
  "Environment :: GPU :: AMD ROCm",
  "Environment :: GPU :: Intel Arc",
]
# ★ 故意留空：本插件是纯 JS、**零运行依赖**，不装任何 Python 包。
dependencies = []

# 规范要求：repository 走 [project.urls].Repository（不是 [tool.comfy].repo）
[project.urls]
Repository = "https://github.com/yanfei0725/dsh-qwen-paint"
Documentation = "https://github.com/yanfei0725/dsh-qwen-paint#readme"
"Bug Tracker" = "https://github.com/yanfei0725/dsh-qwen-paint/issues"

# ════════════════════════════════════════════════════════════════════════════
# [tool.comfy] —— ComfyUI Registry 扩展字段（**字段名大小写敏感**）
# ════════════════════════════════════════════════════════════════════════════

[tool.comfy]
# 必填：必须与 Registry 上的 Publisher ID **完全一致**（在个人页 @ 后面那一串）。
# ⚠ 创建后不可更改 —— 若你的 Publisher ID 不是 yanfei0725，请改成你的实际值。
PublisherId = "yanfei0725"
# 展示名（可随时改）
DisplayName = "DSH Qwen Paint (DeepSeek Harness 插件)"
# ⚠ Icon 暂不填：本仓库目前**没有**符合规范（SVG/PNG/JPG/GIF、≤400×400、正方形）的图标文件。
#   填一个不存在的 URL 只会显示裂图，不如先空着。
#   放好 `assets/icon.png` 后取消下面这行的注释即可：
# Icon = "https://raw.githubusercontent.com/yanfei0725/dsh-qwen-paint/main/assets/icon.png"
