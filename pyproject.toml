# qwen-image-optimized —— ComfyUI Registry 元数据
#
# 依据官方规范：
#   https://docs.comfy.org/registry/specifications
#   https://docs.comfy.org/registry/publishing
#
# ★ 这是一个**真正的 ComfyUI 自定义节点包**（Python），**不依赖 DSH**。
#   （同仓库 main 分支上的 dsh-qwen-paint 是 DSH 插件，两者不是一回事。）

[project]
# 唯一标识符，创建后不可更改；规范建议**不要**包含 "ComfyUI" 字样。
name = "qwen-image-optimized"
# 语义化版本 X.Y.Z。每次发布必须递增，旧版本号不可复用。
# 2.0.0 = **破坏性变更**：优化加载器新增必填的 width/height/weight_dtype
#        （位移依赖真实尺寸；第一版写死 1024 会算错）。旧工作流需重设这几个值。
version = "2.0.1"
description = "千问 2.1（Qwen-Image 2.1）优化节点包：优化加载器（精度档/turbo LoRA/采样位移/前缀缓存）+ 加速链（BlockCache T8 / TE-Speed / Speedup / RDNA3-FA，按互斥规则自动挑）+ 分块解码（防大图 OOM）+ ControlNet + 一键出图。缺文件/缺节点会如实跳过并给出说明。"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
  { name = "yanfei0725", url = "https://github.com/yanfei0725/dsh-qwen-paint" },
]
keywords = [
  "qwen-image", "qwen-image-2.1", "qwen", "image-generation",
  "turbo8", "cache", "tiled-vae", "controlnet", "rocm", "cuda",
]
# ★ 真实依赖：无。本包纯 Python，只用 ComfyUI 自带的 API（comfy.sd / folder_paths / nodes）。
dependencies = []
# 分类器：声明真实支持的 GPU 后端与平台
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Topic :: Multimedia :: Graphics",
  "Environment :: GPU :: NVIDIA CUDA",
  "Environment :: GPU :: AMD ROCm",
  "Environment :: GPU :: Intel Arc",
]

[project.urls]
Repository = "https://github.com/yanfei0725/dsh-qwen-paint"
Documentation = "https://github.com/yanfei0725/dsh-qwen-paint/blob/comfyui-node/README.md"
"Bug Tracker" = "https://github.com/yanfei0725/dsh-qwen-paint/issues"

[tool.comfy]
# 必填，必须与 Registry 上的 Publisher ID 完全一致（个人页 `@` 后面那串），**创建后不可改**。
# ⚠ 是 `gitonnet`，**不是** GitHub 用户名 `yanfei0725` —— 这两者不是一回事。
#   写错会报 "Failed to validate token"（2026-10-14 实测踩过，白折腾两个 token）。
PublisherId = "gitonnet"
# 展示名（可随时改）
DisplayName = "Qwen Image Optimized (Qwen-Image 2.1 优化节点包)"
# ⚠ Icon 暂不填：本包还没有符合规范（SVG/PNG/JPG/GIF、≤400×400、正方形）的图标文件。
#   放好后取消注释即可：
# Icon = "https://raw.githubusercontent.com/yanfei0725/dsh-qwen-paint/comfyui-node/assets/icon.png"
